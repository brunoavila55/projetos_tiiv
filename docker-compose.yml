services:
  postgres:
    image: postgres:16-alpine
    container_name: tiiv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-tiiv}
      # Papel sem superusuário usado pelo app (criado por scripts/initdb)
      APP_DB_USER: ${APP_DB_USER:-tiiv_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env (openssl rand -hex 24)}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    # Só na própria máquina (para `make dev`); o app usa a rede interna do compose
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiiv_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Com o perfil tls, use APP_BIND=127.0.0.1 para só o Caddy (HTTPS) ficar exposto na rede
    ports:
      - "${APP_BIND:-0.0.0.0}:8080:8080"
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-tiiv_app}:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-tiiv}?sslmode=disable
      LISTEN_ADDR: ":8080"
      SESSION_TTL: ${SESSION_TTL:-30m}
      SESSION_MAX_TTL: ${SESSION_MAX_TTL:-12h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      # Vazio: o PIN inicial do admin é sorteado e aparece uma vez no log
      ADMIN_PIN: ${ADMIN_PIN:-}
      LOGIN_FALHAS_POR_IP: ${LOGIN_FALHAS_POR_IP:-4}
      # Só o Caddy (IP fixo abaixo) pode informar o IP do cliente via X-Forwarded-For
      TRUSTED_PROXIES: 172.28.0.10
      # Tira-dúvidas (Workers AI); sem CF_ACCOUNT_ID/CF_API_TOKEN fica desligado
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_AI_MODEL: ${CF_AI_MODEL:-@cf/qwen/qwen3-30b-a3b-fp8}
      ASSISTENTE_NEURONS_DIA: ${ASSISTENTE_NEURONS_DIA:-9500}
      TZ: America/Sao_Paulo

  # Proxy HTTPS opcional: docker compose --profile tls up -d (ver README, "HTTPS")
  caddy:
    image: caddy:2-alpine
    container_name: tiiv_caddy
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      TIIV_HOST: ${TIIV_HOST:-localhost}
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      default:
        ipv4_address: 172.28.0.10

  backup:
    image: postgres:16-alpine
    container_name: tiiv_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATABASE: ${POSTGRES_DB:-tiiv}
      TZ: America/Sao_Paulo
    volumes:
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c '
        echo "Serviço de backup do PostgreSQL iniciado. Retenção: 7 dias."
        while true; do
          DATA=$$(date +%Y-%m-%d_%H-%M-%S)
          ARQUIVO="/backups/tiiv_backup_$$DATA.dump"
          echo "[$$DATA] Gerando backup do banco em $$ARQUIVO..."
          pg_dump -Fc -f "$$ARQUIVO" && echo "[$$DATA] Backup gerado com sucesso!"
          echo "[$$DATA] Removendo backups com mais de 7 dias..."
          find /backups -name "tiiv_backup_*.dump" -mtime +7 -delete
          sleep 86400
        done
      '

volumes:
  postgres_data:
  backup_data:
  caddy_data:

# Sub-rede fixa para o IP do Caddy ser conhecido (TRUSTED_PROXIES)
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
